name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "docs/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências de teste
        run: python -m pip install -r requirements.txt "httpx>=0.27,<1.0" "pytest>=8.0,<9.0"

      - name: Executar testes
        run: pytest -q

      - name: Validar configuração do Compose
        run: docker compose config --quiet

      - name: Construir imagem da API
        run: docker build --tag acervo-livros-api:ci .
